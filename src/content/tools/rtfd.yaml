tagline: "AI reviews on your PRs. The agent only gets to read."
lead: "rtfd watches your pull requests on GitHub, Azure DevOps and Bitbucket, hands each one to Claude Code or Copilot CLI, and posts one review with inline comments. The agent reads and rtfd does the writing, so a hostile PR can't talk its way into your repo."
description: "rtfd (Read The Fine Diff) is a PR review watcher for any AI agent. The agent runs read-only; rtfd posts one review on GitHub, Azure DevOps or Bitbucket."
highlights:
  - title: "The agent never holds a token"
    body: "rtfd fetches the PR and posts the review itself. The agent gets a checkout, the diff, CI state and open threads as files, and no provider token. The worst a malicious PR can get out of it is a bad review, never a bad write."
  - title: "No shell, nothing from your setup"
    body: "Git history comes through `rtfd-git`: four read commands with fixed command lines. No plugins, none of your MCP servers, and agent config in the PR is reset to the base branch first. `rtfd validate` lists every tool the agent ends up with."
  - title: "The verdict comes from policy"
    body: "The agent writes findings; rtfd decides the verdict. Any open Should means not ready, so a review can never say \"ready\" next to two Shoulds. Every comment is scanned for secrets before it goes out."
  - title: "Follow-ups, not repeat reviews"
    body: "After the author pushes fixes, rtfd reviews only what changed, replies \"Looks good now.\" on each fixed thread, resolves it, and leaves the rest alone. A push that only merges the base branch isn't reviewed at all."
  - title: "Reads like a person wrote it"
    body: "Should, Could, MINOR. Short, and no bot marker. The tone lives in a per-repo prompt that rtfd re-reads on every run, so you edit the brief, not the code."
  - title: "Usage limits don't eat retries"
    body: "When the agent hits its plan's limit, rtfd pauses until the stated reset time, for every repo on that account, and gives the attempt back. No more three failed attempts in eleven minutes."
steps:
  - title: "Unpack a release and copy the sample config"
    body: "Grab the archive for your platform from Releases: one binary with its SQLite library, the docs and `examples/`. Put the folder on your PATH and start your home from the sample."
    code: |
      cp -r examples/rtfd.yaml examples/prompts "$HOME/.rtfd/"
  - title: "Point it at a repo"
    body: "One YAML file says which repos to watch, which agent reviews each, which prompt it follows and whose PRs count. The token stays in an environment variable; the config only names it."
    kind: config
    code: |
      repos:
        - name: myapp
          provider: github            # or azure_devops, bitbucket
          repo: your-name/myapp
          trust: trusted
          agent: claude               # or a copilot agent
          prompt: prompts/review.md   # your tone, re-read on every run
          authors: [your-name]        # only these authors' PRs get reviewed
          verdicts: [comment]
          token_env: GH_TOKEN         # the name of the variable, never the token
  - title: "Check it, then review one PR"
    body: "`rtfd validate` checks the config, the token and exactly which tools the agent ends up with, without calling a model. A dry run prints the review it would post; without `--dry-run` it posts once and reads it back."
    code: |
      export GH_TOKEN="$(gh auth token)"
      rtfd validate
      rtfd run myapp --pr 12 --dry-run
  - title: "Leave it watching"
    body: "One long-running process covers every repo. It waits for the pushes to settle and for CI to finish, reviews each new head once, and follows up after a push. `rtfd status` answers \"is it watching?\""
    code: |
      rtfd serve
      rtfd status
notes:
  - "Early: 0.1 release candidates are out. Starting `rtfd serve` at logon (`rtfd install-service`) is next, so for now run it in a terminal you leave open."
  - "Reviews on GitHub, Azure DevOps and Bitbucket Cloud, with Claude Code or Copilot CLI as the reviewer. GitLab, webhooks and code suggestions are on the later list."
  - "Made for repos where you trust the authors: their PR text and code reach the agent. An untrusted tier for public repos open to anyone is planned for later."
  - "It never approves or requests changes on your own PR. GitHub forbids it, so there the review goes up as a comment; on Azure DevOps and Bitbucket the verdict is a vote."
  - "Archives for Windows x64, Linux x64 and Apple Silicon Macs. Building from source needs the .NET 10 SDK."
  - "MIT licensed. The secret check bundles the gitleaks rule set, also MIT."
